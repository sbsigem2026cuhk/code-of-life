<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1235" />
    <title>Code of Life</title>
    <link rel="stylesheet" href="./chooser.css" />
  </head>
  <body>
    <main id="chooser">
      <h1 id="chooser-title">Code of Life</h1>
      <p id="chooser-subtitle">Choose how you want to play</p>

      <div id="chooser-cards">
        <a class="chooser-card" href="./desktop/" id="card-desktop">
          <div class="card-icon">🖥</div>
          <div class="card-title">Computer</div>
          <div class="card-desc">Keyboard controls for laptop and desktop</div>
          <div class="card-controls">A / D · Space or S to drop</div>
        </a>

        <a class="chooser-card" href="./phone/" id="card-phone">
          <div class="card-icon">📱</div>
          <div class="card-title">Phone / Tablet</div>
          <div class="card-desc">Touch controls in portrait mode</div>
          <div class="card-controls">◀ ▶ · DROP · hold phone upright</div>
        </a>
      </div>

      <p id="chooser-hint">Same game, same leaderboard — pick the layout that fits your screen.</p>
    </main>

    <script>
      (function () {
        var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        if (isMobile) {
          document.getElementById("card-phone").classList.add("recommended");
        } else {
          document.getElementById("card-desktop").classList.add("recommended");
        }
      })();
    </script>
  </body>
</html>
